[tools]
# Languages
elixir = "latest"
ruby = "latest"
node = "latest"

# Apps
blender = "latest"

# Tools
usage = "latest"
lua-language-server = "latest"
stylua = "latest"
yt-dlp = "latest"

"aqua:Kampfkarren/selene" = "latest"
"github:dlvhdr/diffnav" = "latest"
"github:TheWaWaR/simple-http-server" = { version = "latest", bin = "simple-http-server" }
"npm:bash-language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"

[settings]
auto_install = false
not_found_auto_install = false
minimum_release_age = "7d"
env_file = ".env"
lockfile = true

disable_backends = ["asdf"]
disable_hints = ["outdated_bump"]
idiomatic_version_file_enable_tools = ["node"]

[settings.ruby]
compile = false
ruby_build_opts = "RUBY_CONFIGURE_OPTS='--disable-install-doc'"
